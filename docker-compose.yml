version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: karsa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: karsa
    ports:
      - "5432:5432"
    volumes:
      - karsa-pg-data:/var/lib/postgresql/data

volumes:
  karsa-pg-data:
